<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>diag v2.2 — LOCH stage sequencer + framebuffer probe</title>
<style>
  .diag2-hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 40;
    background: rgba(8, 10, 15, 0.86);
    border: 1px solid #2a3140;
    border-radius: 0 0 10px 10px;
    margin: 0 6px;
    padding: 10px 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    color: #e8ecf4;
    max-height: 46vh;
    overflow: auto;
  }
  .diag2-hud b { font-size: 12.5px; }
  .diag2-row {
    display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
    margin-top: 7px;
  }
  .diag2-radio { display: inline-flex; align-items: center; gap: 4px; }
  .diag2-row button {
    background: #1c2432; color: #e8ecf4; border: 1px solid #3a465c;
    border-radius: 8px; padding: 7px 14px; font-size: 12.5px;
  }
  .diag2-readout {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10.5px; line-height: 1.5; color: #b9c4d8;
    white-space: pre-wrap; overflow-wrap: anywhere;
    margin: 8px 0 0; padding: 8px; background: #0c101a; border: 1px solid #232b3a;
    border-radius: 6px;
  }
  /* labeled raw-upload previews (three per texture, channel maps) */
  .diag2-thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .diag2-thumb {
    margin: 0; width: 148px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 9.5px; line-height: 1.35; color: #9fb0c8;
  }
  .diag2-thumb img {
    display: block; width: 100%; height: auto;
    border: 1px solid #3a465c; border-radius: 4px;
    background-color: #101520;
    background-image:
      linear-gradient(45deg, #20262f 25%, transparent 25%, transparent 75%, #20262f 75%),
      linear-gradient(45deg, #20262f 25%, transparent 25%, transparent 75%, #20262f 75%);
    background-position: 0 0, 8px 8px;
    background-size: 16px 16px;
  }
  .diag2-thumb figcaption { margin-top: 2px; overflow-wrap: anywhere; }

  /* per-op stage timeline */
  .diag2-stages {
    margin: 10px 0 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 8px;
  }
  .diag2-stage {
    background: #0c101a; border: 1px solid #232b3a;
    border-radius: 6px; padding: 7px 9px;
  }
  .diag2-stage.diag2-rect {
    border-color: #ff2fa0; background: #1d0b16;
    box-shadow: 0 0 0 1px #ff2fa0;
  }
  .diag2-stage-head {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; color: #e8ecf4; overflow-wrap: anywhere;
  }
  .diag2-stage-metrics {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 9.5px; line-height: 1.45; color: #b9c4d8;
    white-space: pre-wrap; overflow-wrap: anywhere;
    margin-top: 4px; padding: 5px 7px;
    background: #080b12; border-radius: 4px;
  }
  .diag2-thumbrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .diag2-thumbrow .diag2-thumb { width: 118px; }
  .diag2-subhead {
    margin: 14px 0 0; font-size: 12px; color: #e8ecf4;
    border-top: 1px solid #2a3140; padding-top: 10px;
  }
  .diag2-tip { font-size: 11px; line-height: 1.5; color: #9fb0c8; margin: 8px 0 0; }
  .diag2-checker {
    position: fixed; inset: 0; z-index: 0;
    background-color: #00e5ff;
    background-image:
      linear-gradient(45deg, #ff2fa0 25%, transparent 25%, transparent 75%, #ff2fa0 75%),
      linear-gradient(45deg, #ff2fa0 25%, transparent 25%, transparent 75%, #ff2fa0 75%);
    background-position: 0 0, 16px 16px;
    background-size: 32px 32px;
  }
  /* mark the actual canvas bounds — diagnostic page style only */
  .hero__mark canvas {
    outline: 2px dashed rgba(255, 255, 255, 0.75);
  }
</style>
</head>
<body>
<div id="diag2-root"></div>
<script type="module" src="/src/webgl-diag2-entry.tsx"></script>
</body>
</html>
